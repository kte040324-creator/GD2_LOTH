<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Woods - LOTH Bracelet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a href="index.html" class="page-back" aria-label="Back">
      <img src="./assets/figma/icon-back.svg" alt="" width="31" height="31" />
    </a>
    <main class="viewport">
      <div class="stage stage--woods" aria-hidden="true">
        <div class="page page--woods" data-node-id="336:265" aria-label="Products - Woods">
          <!-- Header -->
          <header class="header" aria-label="Header">
            <div class="profile-trigger" aria-label="Profile">
              <img class="icon-account" src="./assets/figma/icon-account.svg" alt="" />
              <div class="profile-overlay" aria-hidden="true">
                <div class="profile-overlay__chrome"></div>
                <div class="profile-frame" aria-hidden="true">
                  <div class="profile-frame__panel"></div>
                  <div class="profile-frame__hello">
                    <div>Hello,</div>
                    <div>Taeeun Kim</div>
                  </div>
                  <img class="profile-frame__line" src="./assets/figma/profile-menu-line.svg" alt="" />
                  <div class="profile-frame__item profile-frame__item--active">My Profile</div>
                  <div class="profile-frame__item profile-frame__item--dim" style="top: 233px">My Orders</div>
                  <div class="profile-frame__item profile-frame__item--dim" style="top: 304px">My Addresses</div>
                  <div class="profile-frame__item profile-frame__item--dim" style="top: 379px">My points</div>
                  <div class="profile-frame__item profile-frame__item--dim" style="top: 449px">Recently Viewed</div>
                </div>
              </div>
            </div>
            <a href="index.html" class="logo-link logo-link--woods">
              <img class="logo" src="./assets/figma/logo.png" alt="LOTH" />
            </a>
            <div class="country" aria-label="Country">
              <img class="country-icon" src="./assets/figma/icon-earth.svg" alt="" />
              <span class="country-text">United States</span>
            </div>
            <div class="icon-cart" aria-label="Cart">
              <img class="cart-part cart-part--dot" src="./assets/figma/icon-cart-dot.svg" alt="" />
              <img class="cart-part cart-part--outline" src="./assets/figma/icon-cart-outline.svg" alt="" />
              <img class="cart-part cart-part--handle" src="./assets/figma/icon-cart-handle.svg" alt="" />
            </div>
          </header>

          <!-- Breadcrumb -->
          <p class="woods-breadcrumb">Products – <strong>Woods</strong></p>

          <!-- Main product image -->
          <section class="woods-hero">
            <div class="woods-hero__image-wrap">
              <div class="woods-hero__rotate">
                <img class="woods-hero__image" src="./assets/figma/products-woods.png" alt="Wood beads" />
              </div>
            </div>
          </section>

          <!-- Empty 위치에 GLB (배경 없는 컨테이너) -->
          <div class="woods-rect woods-rect--1">
            <div class="woods-rect__canvas" data-three data-model="wood_ebony.glb"></div>
          </div>
          <div class="woods-rect woods-rect--2">
            <div class="woods-rect__canvas" data-three data-model="wood_jujube.glb"></div>
          </div>
          <div class="woods-rect woods-rect--3">
            <div class="woods-rect__canvas" data-three data-model="wood_sandal.glb"></div>
          </div>
          <img class="woods-logo woods-logo--left" src="./assets/figma/logo.png" alt="" aria-hidden="true" data-node-id="336:278" />
          <img class="woods-logo woods-logo--center" src="./assets/figma/logo.png" alt="" aria-hidden="true" data-node-id="336:277" />
          <img class="woods-logo woods-logo--right" src="./assets/figma/logo.png" alt="" aria-hidden="true" data-node-id="336:276" />

          <!-- Footer -->
          <footer class="footer footer--woods">
            <p class="footer-copy">Copyright LOTH</p>
            <div class="footer-address">
              <p>000-0000-0000</p>
              <p>1300 W Mt Royal Ave, Baltimore, MD 21217</p>
            </div>
          </footer>
        </div>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./woods-three.js"></script>
    <script>
      (() => {
        const DESIGN_WIDTH = 1920;
        const setScale = () => {
          const scale = Math.min(1, window.innerWidth / DESIGN_WIDTH);
          document.documentElement.style.setProperty("--page-scale", String(scale));
        };
        setScale();
        window.addEventListener("resize", setScale);
      })();
    </script>
  </body>
</html>
